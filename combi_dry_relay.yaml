blueprint:
  name: Combi dry relay — circuit interlock
  description: >
    Включает сухое реле комби только если открыт хотя бы один контур.

    • Радиаторы (TRV) — сущности без задержки (позиция > 0 или climate heating).
    • Тёплый пол — сервоприводы + задержка (сек); время отсчитывается само
      с момента включения серво (last_changed).

    Контакт реле: NC — прямая логика (switch ON = котёл греет);
    NO — инверсия (switch OFF = котёл греет), если проводка на NO и всё было наоборот.

    Срабатывает при открытии/закрытии контура и по таймеру, пока идёт задержка.
  domain: automation
  source_url: https://github.com/faganchalabizada/smarthome_combi_dry_relay/blob/main/combi_dry_relay.yaml
  input:
    dry_relay:
      name: Сухое реле комби
      description: Dry contact / реле зимнего режима котла
      selector:
        entity:
          domain: switch

    contact_type:
      name: Контакт реле (NO / NC)
      description: >
        NC — прямая: нужны контуры → включаем switch.
        NO — инверсия: нужны контуры → выключаем switch (если подключили на NO и работало наоборот).
      default: "nc"
      selector:
        select:
          options:
            - label: "NC (прямая, ON = греть)"
              value: "nc"
            - label: "NO (инверсия, OFF = греть)"
              value: "no"
          mode: dropdown

    immediate_circuits:
      name: Контуры без задержки (радиаторы)
      description: >
        sensor позиции TRV (>0 = открыт) и/или climate (hvac_action=heating).
        Можно несколько.
      default: []
      selector:
        entity:
          domain:
            - sensor
            - climate
            - switch
          multiple: true

    delayed_circuits:
      name: Контуры с задержкой (сервоприводы ТП)
      description: switch сервоприводов тёплого пола. Можно несколько.
      default: []
      selector:
        entity:
          domain: switch
          multiple: true

    open_delay:
      name: Задержка открытия сервопривода
      description: >
        Секунды после включения серво, пока контур считается закрытым
        (типично 60–120 для термоголовки тёплого пола). Для радиаторов не используется.
      default: 120
      selector:
        number:
          min: 0
          max: 600
          step: 10
          unit_of_measurement: sec
          mode: box

trigger:
  - platform: state
    entity_id: !input immediate_circuits
  - platform: state
    entity_id: !input delayed_circuits
  - platform: state
    entity_id: !input dry_relay
  - platform: homeassistant
    event: start
  - platform: time_pattern
    seconds: "/30"

variables:
  dry_relay_entity: !input dry_relay
  contact: !input contact_type
  immediate: !input immediate_circuits
  delayed: !input delayed_circuits
  delay_sec: !input open_delay
  any_circuit_open: >-
    {% set ns = namespace(open=false) %}
    {% for e in immediate %}
      {% set domain = e.split('.')[0] %}
      {% if domain == 'switch' and is_state(e, 'on') %}
        {% set ns.open = true %}
      {% elif domain == 'sensor' and states(e) not in ['unknown','unavailable','none',''] and (states(e)|float(0)) > 0 %}
        {% set ns.open = true %}
      {% elif domain == 'climate' and is_state_attr(e, 'hvac_action', 'heating') %}
        {% set ns.open = true %}
      {% endif %}
    {% endfor %}
    {% for e in delayed %}
      {% if is_state(e, 'on')
           and states[e] is not none
           and (as_timestamp(now()) - as_timestamp(states[e].last_changed, default=0)) >= (delay_sec | int(0)) %}
        {% set ns.open = true %}
      {% endif %}
    {% endfor %}
    {{ ns.open }}
  # want_heat: котлу нужен сухой контакт «греть»
  # NC: катушка ON замыкает цепь нагрева → target switch on
  # NO: катушка ON размыкает/инвертирует → target switch off when heating
  relay_should_be_on: >-
    {% set want_heat = any_circuit_open %}
    {% if contact == 'no' %}
      {{ not want_heat }}
    {% else %}
      {{ want_heat }}
    {% endif %}

condition: []

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ relay_should_be_on and not is_state(dry_relay_entity, 'on') }}"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ dry_relay_entity }}"
      - conditions:
          - condition: template
            value_template: "{{ (not relay_should_be_on) and not is_state(dry_relay_entity, 'off') }}"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ dry_relay_entity }}"

mode: queued
max: 10
